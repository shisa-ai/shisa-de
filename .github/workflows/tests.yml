name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest tests/
      - run: python -m build
      - name: Check the installed package and checkpoint tokenizer
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "${RUNNER_TEMP}"
          python - <<'PY'
          from shisa_de import DecisionModel, Noul
          with DecisionModel() as model:
              prompt = model.readout.render("test", Noul("Is this a test?"))
              model.readout.check_boundary(prompt, model.readout.slots(2))
          PY
