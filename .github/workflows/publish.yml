name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install '.[dev]' build twine
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from shisa_de import __version__
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == __version__, 'Package version fields disagree'
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag does not match package version'
          PY
      - name: Test
        run: .venv/bin/python -m pytest tests/
      - name: Build and check distributions
        run: |
          .venv/bin/python -m build
          .venv/bin/python -m twine check --strict dist/*
      - name: Smoke-test installed wheel
        run: |
          uv venv --python 3.12 /tmp/shisa-de-wheel
          uv pip install --python /tmp/shisa-de-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/shisa-de-wheel/bin/shisa-de --help
          /tmp/shisa-de-wheel/bin/python - <<'PY'
          from importlib import resources
          from shisa_de import DecisionModel, Noul
          assert resources.files('shisa_de').joinpath('data/calibration.json').is_file()
          with DecisionModel() as model:
              prompt = model.readout.render('test', Noul('Is this a test?'))
              model.readout.check_boundary(prompt, model.readout.slots(2))
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/shisa_de-*.whl
            dist/shisa_de-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/shisa-de/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
